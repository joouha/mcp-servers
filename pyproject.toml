[project]
name = "mcp-servers"
version = "0.1.0"
description = "A collection of custom MCP servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "donetick-mcp",
    "caldav-mcp",
    "tandoor-mcp",
    "joplin-mcp",
    # "browser-mcp",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
# Several packages have a `tests/test_readonly.py` and none of the test
# directories are packages, so pytest's default `prepend` import mode gives
# them all the module name `test_readonly` and refuses to collect the 2nd and
# 3rd. `importlib` mode derives module names from each file's path instead.
addopts = "--import-mode=importlib"

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
donetick-mcp = { workspace = true }
caldav-mcp = { workspace = true }
tandoor-mcp = { workspace = true }
joplin-mcp = { workspace = true }
browser-mcp = { workspace = true }
