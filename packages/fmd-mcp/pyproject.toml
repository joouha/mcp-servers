[project]
name = "fmd-mcp"
version = "0.1.0"
description = "MCP server for FMD (Find My Device) - view location history and request current location"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0",
    "fmd-api>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
fmd-mcp = "fmd_mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]